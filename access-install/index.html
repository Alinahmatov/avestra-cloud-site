<!DOCTYPE html>
<html lang="en" data-theme="light" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avistra</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2f5bff">
  <link rel="canonical" href="https://www.avestra.online/access-install/">
  <link rel="icon" href="../assets/favicon.ico">
  <link rel="apple-touch-icon" href="../assets/avistra-icon.png" data-brand-icon>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../styles.css?v=ui-20260922plain">
  <style>
    html.is-kicked,
    html.is-kicked body { overflow: hidden; }
    .site-lock {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: var(--page);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 32px 20px;
      text-align: center;
    }
    .site-lock[hidden] { display: none !important; }
    .site-lock-card { max-width: 36rem; }
    .site-lock-card img { width: 48px; height: 48px; border-radius: 12px; }
    .site-lock-card h1 { margin: 16px 0 8px; font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.04em; }
    .site-lock-hint { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .gate-page .gate-main { padding-top: 120px; }
    .gate-form { max-width: 26rem; margin: 28px auto 0; text-align: left; }
    .gate-download { margin-top: 28px; }
  </style>
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("lang");
        var l = (q && /^(en|az|ru)$/.test(q)) ? q : (localStorage.getItem("avestra-lang") || "en");
        if (!/^(en|az|ru)$/.test(l)) l = "en";
        document.documentElement.lang = l;
        document.documentElement.dataset.lang = l;
        var th = localStorage.getItem("avestra-theme");
        document.documentElement.dataset.theme = (th === "dark" || th === "light") ? th : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <script>document.documentElement.classList.add("js");</script>
</head>
<body class="gate-page">
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="../">
        <img data-brand-icon src="../assets/avistra-icon.png" width="36" height="36" alt="">
        <span>Avistra <em>Cloud</em></span>
      </a>
      <div class="nav-tools">
        <button class="theme-btn" type="button" data-theme-toggle data-i18n-aria="nav.themeLight" aria-label="Switch to dark theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 14.3A7.5 7.5 0 1 1 9.7 3 9 9 0 0 0 21 14.3z"/></svg>
        </button>
        <div class="lang" data-lang-switch>
          <button class="lang-btn" type="button" data-lang-toggle data-i18n-aria="nav.lang" aria-haspopup="listbox" aria-expanded="false">
            <span class="lang-flag" data-lang-flag data-flag="en"></span>
            <span data-lang-code>EN</span>
          </button>
          <ul class="lang-menu" role="listbox">
            <li><button type="button" data-set-lang="en"><span class="lang-flag" data-flag="en"></span> English</button></li>
            <li><button type="button" data-set-lang="az"><span class="lang-flag" data-flag="az"></span> Azərbaycan</button></li>
            <li><button type="button" data-set-lang="ru"><span class="lang-flag" data-flag="ru"></span> Русский</button></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <main class="page wrap gate-main">
    <img class="cta-icon" data-brand-icon src="../assets/avistra-icon.png" width="64" height="64" alt="">
    <p class="kicker" data-i18n="gate.kicker">Restricted</p>
    <h1 data-i18n="gate.title">Password required</h1>
    <p class="lede" data-i18n="gate.lead">This path is not a public download.</p>

    <form class="request-form gate-form" data-gate-form autocomplete="off">
      <div class="field">
        <label for="gate-password" data-i18n="gate.password">Password</label>
        <input id="gate-password" name="gate-password" type="password" data-gate-password required maxlength="120" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off">
      </div>
      <button class="btn primary request-submit" type="submit" data-i18n="gate.submit">Continue</button>
      <p class="form-note" data-gate-status></p>
    </form>

    <div class="download-box gate-download" data-gate-download hidden>
      <h3 data-i18n="gate.ready">Password accepted.</h3>
      <p data-i18n="gate.note">Portable Avistra Access. Empty copy — import licenses in Access. Not Avistra Cloud.</p>
      <a class="btn primary" data-gate-link href="https://github.com/Alinahmatov/avestra-cloud-site/releases/latest/download/AvistraAccess.zip" rel="noopener" data-i18n="gate.download">Download Avistra Access</a>
    </div>
  </main>

  <script src="ui.js?v=20260922gate2"></script>
  <script src="gate.js?v=20260922gate2"></script>
</body>
</html>
